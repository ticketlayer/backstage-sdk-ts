#
# Publishing authenticates with npm **trusted publishing**: the job proves it
# is this workflow, in this repository, with a GitHub OIDC token, and npm
# hands back a short-lived credential. There is no NPM_TOKEN to leak, rotate
# or forget to renew, and provenance attestations are generated automatically.
#
# This only works because npm has a trusted publisher registered for
# @ticketlayer/backstage. If that registration is missing, or names a
# different workflow file, the publish fails loudly with an auth error - which is the point. The
# old behaviour skipped publishing with a green tick when the token was
# absent.
name: Release SDK

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # the OIDC token trusted publishing exchanges
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10; the OIDC exchange that trusted publishing runs
      # on landed in npm 11.5.1. Without this the publish falls back to
      # looking for a token it no longer has.
      - name: Use an npm that can do the OIDC exchange
        run: npm install -g npm@^11.5.1

      - run: npm ci

      # src/generated is gitignored: it is produced from backstage-api's
      # OpenAPI document, which is itself generated from the API's route
      # definitions. Rebuild both here, the same way the service deploys do.
      - uses: actions/checkout@v4
        with:
          repository: ticketlayer/backstage-api
          ref: main
          path: spec/backstage-api
          token: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
      - name: Generate the OpenAPI document and the client types
        run: |
          (cd spec/backstage-api && npm ci && npm run spec:generate)
          cp spec/backstage-api/openapi.json openapi.json
          npx openapi-typescript openapi.json -o src/generated/types.ts
          rm -rf spec

      # client.ts is regenerated by backstage-sdk-tooling (locally or via
      # automation) and committed with a changeset; CI builds and ships it.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Publishing needs the org secret NPM_TOKEN. Until it is set the release
      # step is skipped with a notice, so the build and tests still gate main.

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          title: 'Release @ticketlayer/backstage'
          commit: 'Release @ticketlayer/backstage'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
