name: Release SDK

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # src/generated is gitignored: it is produced from backstage-api's
      # OpenAPI document, which is itself generated from the API's route
      # definitions. Rebuild both here, the same way the service deploys do.
      - uses: actions/checkout@v4
        with:
          repository: ticketlayer/backstage-api
          ref: main
          path: spec/backstage-api
          token: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
      - name: Generate the OpenAPI document and the client types
        run: |
          (cd spec/backstage-api && npm ci && npm run spec:generate)
          cp spec/backstage-api/openapi.json openapi.json
          npx openapi-typescript openapi.json -o src/generated/types.ts
          rm -rf spec

      # client.ts is regenerated by backstage-sdk-tooling (locally or via
      # automation) and committed with a changeset; CI builds and ships it.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Publishing needs the org secret NPM_TOKEN. Until it is set the release
      # step is skipped with a notice, so the build and tests still gate main.
      - name: Check publishing credentials
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set - skipping version/publish. Set the org secret NPM_TOKEN to enable releases of @ticketlayer/backstage."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release PR or publish
        if: steps.npm.outputs.configured == 'true'
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          title: 'Release @ticketlayer/backstage'
          commit: 'Release @ticketlayer/backstage'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
