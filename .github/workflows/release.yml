name: Release SDK

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Publish exactly what is committed: client.ts is regenerated by
      # backstage-sdk-tooling (locally or via automation) and committed with
      # a changeset; CI only builds and ships it.
      - name: Build
        run: npm run build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          title: 'Release @ticketlayer/backstage-sdk'
          commit: 'Release @ticketlayer/backstage-sdk'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
